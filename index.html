    <style>
        :root { color-scheme: light; }
        img { filter: none !important; }
        body { font-family: 'Work Sans', sans-serif; background-color: #FDFDFB; color: #4A4A4A; overflow-x: hidden; }
        
        #navbar {
            background-color: rgba(94, 113, 97, 0.6); 
            transition: all 0.4s ease;
            position: fixed;
            left: 50%; transform: translateX(-50%);
            z-index: 1000;
            backdrop-filter: blur(10px);
        }
        .header-hidden { opacity: 0; pointer-events: none; transform: translate(-50%, -20px) !important; }
        #mobile-menu { transition: transform 0.4s ease; transform: translateX(100%); }
        #mobile-menu.open { transform: translateX(0); }
        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }

        /* Sequential fade-out then fade-in (zero overlap) */
        .subtitle-rotator {
            display: grid;
            align-items: center;
        }
        .subtitle-rotator span {
            grid-area: 1 / 1;
            transition: opacity 0.45s ease-in-out, transform 0.45s ease-in-out;
        }
        .subtitle-visible {
            opacity: 1;
            transform: translateY(0);
        }
        .subtitle-hidden {
            opacity: 0;
            transform: translateY(3px);
            pointer-events: none;
        }

        #contact { background-size: cover; background-position: center; position: relative; }
        @media (max-width: 1023px) {
            #contact { background-image: url('office-chairs.jpg'); }
        }
    </style>
</head>
